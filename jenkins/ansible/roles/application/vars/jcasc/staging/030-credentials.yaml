---
credentials:
  system:
    domainCredentials:
    - credentials:
      - string:
          scope: SYSTEM
          id: otel-token
          description: Metal3 CI log shipping
          secret: ${file:/run/secrets/jenkins-otel-token}
      - openstackV3:
          scope: GLOBAL
          id: xerces-est-metal3ci
          description: Metal3 CI cloud access
          userName: metal3ci
          userDomain: xerces
          projectName: EST_Metal3_CI
          projectDomain: xerces
          password: ${file:/run/secrets/jenkins-cloud-xerces-metal3ci-password}
      - baremetalCloud:
          id: oci-api-paris-new
          description: new Oracle Cloud credentials
          regionId: "{{ oci_compute_credentials.region }}"
          tenantId: "{{ oci_compute_credentials.tenantid }}"
          userId: "{{ oci_compute_credentials['ocid-userid'] }}"
          fingerprint: "{{ oci_compute_credentials['oci-api-key-fingerprint'] }}"
          apikey: ${file:/run/secrets/jenkins-cloud-oci-api-privatekey-new}
      - basicSSHUserPrivateKey:
          id: metal3-oracle-cloud-ssh-private-key-rsa
          description: ssh rsa key used for oracle cloud VM
          username: metal3ci
          privateKeySource:
            directEntry:
              privateKey: ${file:/run/secrets/jenkins-cloud-oci-ssh-privatekey}
      - string:
          scope: GLOBAL
          id: nordix-metal3-github-fork-sync-token
          description: |
            This is a github token belonging to account nordix-airship-ci. It is used for syncing Nordix forks with their upstream repositories.
          secret: ${file:/run/secrets/nordix-metal3-github-fork-sync-token}
      - usernamePassword:
          scope: GLOBAL
          id: infra-nordix-artifactory-api-key
          description: Artifactory API Key for infra user
          username: infra
          password: ${file:/run/secrets/infra-nordix-artifactory-api-key}
      - basicSSHUserPrivateKey:
          id: nordix-metal3-github-ssh
          description: nordix-airship-ci (ssh private key. Used in Github repo sync job. Also added to GitHub https://github.com/nordix-airship-ci)
          username: nordix-airship-ci
          privateKeySource:
            directEntry:
              privateKey: ${file:/run/secrets/nordix-metal3-github-ssh}
      - string:
          scope: GLOBAL
          id: metal3-clusterctl-github-token
          description: Github token for use in Metal3 tests (no permissions)
          secret: ${file:/run/secrets/metal3-clusterctl-github-token}
      - usernamePassword:
          scope: GLOBAL
          id: metal3ci_harbor
          description: Harbor credentials for metal3ci user
          username: estjorvas_ci
          password: ${file:/run/secrets/metal3ci_harbor}
      - usernamePassword:
          scope: GLOBAL
          id: metal3-ci-log-collector-push
          description: CI log collector R/W user
          username: metal3ci
          password: ${file:/run/secrets/metal3-ci-log-collector-push}
      - file:
          description: RSA private key for accessing oracle cloud
          fileName: id_rsa_metal3ci_oci_api
          id: metal3-oracle-cloud-api-private-key # NOTE: remove once unused
          scope: GLOBAL
          secretBytes: ${fileBase64:/run/secrets/jenkins-cloud-oci-api-privatekey}
      - file:
          description: RSA private key for accessing oracle cloud instances
          fileName: id_rsa_metal3ci_oci_api
          id: metal3-oracle-cloud-api-private-key-new
          scope: GLOBAL
          secretBytes: ${fileBase64:/run/secrets/jenkins-cloud-oci-api-privatekey-new}
      - file:
          description: |
            Env file containing OCI credentials and variables for uploading images to OCI -
            OCI_CLI_USER, OCI_CLI_FINGERPRINT, OCI_CLI_TENANCY, OCI_CLI_REGION,
            OCI_CLI_KEY_FILE, COMPARTMENT_OCID, NAMESPACE_OCID, BUCKET_NAME
          fileName: oci_credentials.sh
          id: metal3-oracle-paris-env-vars # NOTE: remove once unused
          scope: GLOBAL
          secretBytes: "{{ oci_envvars_encoded }}"
      - file:
          description: |
            New env file containing OCI credentials and variables for managing instances in OCI -
            OCI_CLI_USER, OCI_CLI_FINGERPRINT, OCI_CLI_TENANCY, OCI_CLI_REGION,
            OCI_CLI_KEY_FILE, COMPARTMENT_OCID
          fileName: oci_credentials.sh
          id: metal3-oracle-paris-env-vars-new-compute
          scope: GLOBAL
          secretBytes: "{{ oci_compute_envvars_encoded }}"
      - file:
          description: |
            New env file containing OCI credentials and variables for uploading images to OCI -
            OCI_CLI_USER, OCI_CLI_FINGERPRINT, OCI_CLI_TENANCY, OCI_CLI_REGION,
            OCI_CLI_KEY_FILE, COMPARTMENT_OCID, NAMESPACE_OCID, BUCKET_NAME
          fileName: oci_credentials.sh
          id: metal3-oracle-paris-env-vars-new-image
          scope: GLOBAL
          secretBytes: "{{ oci_image_envvars_encoded }}"
      - file:
          description: RSA private key for accessing oracle cloud images
          fileName: id_rsa_metal3ci_oci_api
          id: metal3-oracle-cloud-api-private-key-new-image
          scope: GLOBAL
          secretBytes: ${fileBase64:/run/secrets/jenkins-cloud-oci-api-privatekey-new-image}
      - file:
          description: RSA private key for accessing oracle cloud images
          fileName: id_rsa_metal3ci_oci_api
          id: metal3-oracle-cloud-api-private-key-node-image-uploader
          scope: GLOBAL
          secretBytes: ${fileBase64:/run/secrets/jenkins-cloud-oci-api-privatekey-node-image}
      - file:
          description: |
            Env file containing OCI credentials and variables for uploading images to OCI -
            OCI_CLI_USER, OCI_CLI_FINGERPRINT, OCI_CLI_TENANCY, OCI_CLI_REGION,
            OCI_CLI_KEY_FILE, COMPARTMENT_OCID
          fileName: oci_credentials.sh
          id: metal3-oracle-paris-env-vars-node-image-uploader
          scope: GLOBAL
          secretBytes: "{{ oci_node_image_envvars_encoded }}"
      - file:
          description: RSA private key for accessing oracle cloud images
          fileName: id_rsa_metal3ci_oci_api
          id: metal3-oracle-cloud-api-private-key-node-image-par-generator
          scope: GLOBAL
          secretBytes: ${fileBase64:/run/secrets/jenkins-cloud-oci-api-privatekey-node-image-par}
      - file:
          description: |
            Env file containing OCI credentials and variables for generating PARs in OCI -
            OCI_CLI_USER, OCI_CLI_FINGERPRINT, OCI_CLI_TENANCY, OCI_CLI_REGION,
            OCI_CLI_KEY_FILE, COMPARTMENT_OCID
          fileName: oci_credentials.sh
          id: metal3-oracle-paris-env-vars-node-image-par-generator
          scope: GLOBAL
          secretBytes: "{{ oci_node_image_par_envvars_encoded }}"
