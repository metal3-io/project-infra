# adapted from https://github.com/ansible/ansible/issues/83978#issuecomment-2369293904
- name: generate Jenkins configuration
  include_vars:
    file: "{{ item }}"
  loop: "{{ q('fileglob', 'vars/jcasc/' + env + '/*.yaml') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  no_log: true
  register: jcasc_configs

- name: collate Jenkins configuration
  set_fact:
    jcasc: "{{ jcasc_configs.results | map(attribute='ansible_facts') | combine(list_merge='append', recursive=True) }}"
  no_log: true
  vars:
    auto_user_query: "[?name=='automation'].id"
    auto_user: "{{ credentials.jenkins.users | json_query(auto_user_query) | first }}"
    prow_user_query: "[?name=='prow'].id"
    prow_user: "{{ credentials.jenkins.users | json_query(prow_user_query) | first }}"
    jjb_user_query: "[?name=='jjb'].id"
    jjb_user: "{{ credentials.jenkins.users | json_query(jjb_user_query) | first }}"

- name: read current configuration
  slurp:
    src: "{{ jenkins_volume_path }}/jenkins.yaml"
  no_log: true
  register: remote_config
  ignore_errors: true

- name: check Jenkins container
  containers.podman.podman_container_info:
    name: jenkins
  register: jenkins_container_check

- name: mark Jenkins presence
  set_fact:
    jenkins_present: "{{ not jenkins_container_check.stderr_lines }}"

- block:
  - name: validate configuration against schema
    include_tasks: validate.yaml
    when: config.jenkins.validate | bool

  - name: test configuration
    include_tasks: dryrun.yaml
  when:
  - config_changed
  - jenkins_present
  vars:
    config_changed: "{{ remote_config.content | b64decode | default('{}') | from_yaml != jcasc }}"

- name: configure Jenkins
  copy:
    content: |
      {{ jcasc | to_yaml }}
    dest: "{{ jenkins_volume_path }}/jenkins.yaml"
    backup: yes
  no_log: true
  diff: no
  notify: "{{ jenkins_container_check.stderr_lines | ternary([], ['reload Jenkins configuration']) }}" # don't reload without the container

# NOTE: remove the following JJB-related section _IF_ JJB is updated through Prow
- name: survey Python environment
  setup:
    gather_subset: python

- name: install Jenkins Job Builder
  pip:
    name:
    - 'setuptools<72' # pkg_resources API dependency
    - "jenkins-job-builder=={{ config.jenkins.jobbuilder.version }}"
    virtualenv: "{{ jenkins_volume_path }}/jjb-venv"
    virtualenv_command: "{{ ansible_facts['python']['executable'] }} -m venv"

- name: configure Jenkins Job Builder
  block:
  - name: obtain container info
    containers.podman.podman_container_info:
      name: jenkins
    register: jenkins_container_info

  - name: configure JJB
    ini_file:
      path: /root/.config/jenkins_jobs/jenkins_jobs.ini
      section: job_builder
      section_has_values:
      - option: ignore_cache
        value: true
      - option: keep_descriptions
        value: false
      - option: recursive
        value: true
      - option: allow_duplicates
        value: false
      allow_no_value: true

  - name: configure Jenkins server for JJB
    ini_file:
      path: /root/.config/jenkins_jobs/jenkins_jobs.ini
      section: jenkins
      option: "{{ item.option }}"
      value: "{{ item.value }}"
    loop: "{{ jjb_jenkins_opts }}"
    loop_control:
      label: "{{ item.option }}"
    vars:
      jjb_jenkins_opts:
      - { 'option': 'url', 'value': "http://{{ jenkins_container_info.containers[0].NetworkSettings.Networks.app.IPAddress }}:8080" }
      - { 'option': 'query_plugins_info', 'value': true }
  when: jenkins_present

- name: get job definitions
  git:
    repo: https://gerrit.nordix.org/infra/cicd # NOTE: might be better to turn this into a sparse checkout as right now any change will trigger a JJB run
    dest: "{{ jenkins_volume_path }}/cicd"
  register: cicd_checkout

- name: deploy Metal³ jobs
  block:
  - name: test jobs
    command: jjb-venv/bin/jenkins-jobs test --config-xml --recursive cicd/jjb/metal3
    changed_when: false
    register: jjb_test
  - name: update jobs
    command: jjb-venv/bin/jenkins-jobs update --workers 4 --delete-old --recursive cicd/jjb/metal3
    when: jjb_test is success
  module_defaults:
    ansible.builtin.command:
      chdir: "{{ jenkins_volume_path }}"
  environment:
    JJB_USER: "{{ credentials.jenkins.users | json_query(auto_user_query) | first }}"
    JJB_PASSWORD: "{{ credentials.jenkins.secrets | json_query(token_query) | first }}"
  vars:
    auto_user_query: "[?name=='automation'].id"
    token_query: "[?name=='jenkins-api-token'].data"
  no_log: true
  when:
  - jenkins_present
  - cicd_checkout is changed
  tags: jobs
