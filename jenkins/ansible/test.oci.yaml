---
plugin: oracle.oci.oci
config_file: ~/.oci/config
config_profile: DEFAULT
compartments:
- compartment_ocid: ocid1.tenancy.oc1..aaaaaaaalbjclmsqx5zyjbqgtywhfxns4qavoppuhp6peixiqmm6vu3qyn7a
hostname_format_preferences:
- "display_name"
cache: no
