# Description:
# ============
# This file contains global default values for metal3 projects

# Project Defaults
- defaults: &global_defaults
    name: global
    job_prefix: 'metal3'
    ci_github_whitelist_org:
    - metal3-io
    ci_github_repo: 'https://github.com/metal3-io/project-infra.git'
    e2e_tests_pipeline: 'jenkins/jobs/capm3-e2e-tests.groovy'
    dev_env_integration_test_pipeline: 'jenkins/jobs/dev_env_integration_tests.groovy'
    image_building_pipeline: 'jenkins/jobs/image_building.groovy'
    pre_release_tests_pipeline: 'jenkins/jobs/pre_release_tests.groovy'
    cni_provider: 'calico'
- defaults:
    name: integration-default-values
    <<: *global_defaults
    ironic_install_type: 'rpm'
    build_mariadb_image_locally: 'false'
    ironic_use_mariadb: 'false'
    use_irso: 'false'
    name_postfix: ''
    trigger_postfix: ''
