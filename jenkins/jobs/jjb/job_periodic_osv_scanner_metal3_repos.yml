# Description:
# ============
# This file contains job template definition for periodically scanning the
# Metal3 repositories for vulnerabilities with OSV-Scanner. It creates a
# pipeline job. The pipeline script is maintained in this repository at
# jenkins/jobs/osv_scanner_metal3.groovy.

- job-template:
    id: periodic_osv_scanner_metal3_repos
    name: '{job_prefix}-periodic-osv-scanner-metal3-repos'
    description: "Run OSV scanner on Metal3 repositories(CAPM3, BMO, IPAM and IRSO)."
    project-type: pipeline
    defaults: global
    disabled: False
    concurrent: True
    properties:
    - build-discarder:
        days-to-keep: 30
        num-to-keep: 300
        artifact-days-to-keep: -1
        artifact-num-to-keep: -1

    triggers:
    - timed: "0 5 * * *" # Runs every day at 5.00 UTC (7.00 EET)

    pipeline-scm:
      scm:
      - git:
          url: "{ci_github_repo}"
          branches:
          - 'main'
          name: 'origin'
          refspec: '+refs/heads/*:refs/remotes/origin/*'
          wipe-workspace: True
          honor-refspec: True
          shallow-clone: False
      script-path: 'jenkins/jobs/osv_scanner_metal3.groovy'
      lightweight-checkout: False
