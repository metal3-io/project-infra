# Description:
# ============
# This file contains job template definition for Cluster API Provider Metal3 (CAPM3) e2e k8s upgrade tests.
# This job can be triggered manually or through a Github pull request. It creates a
# pipeline job. The pipeline scripts are maintained in Metal3 CI project infra repository.

- job-template:
    id: capm3_e2e_k8s_upgrade_tests_prow
    name: '{job_prefix}-e2e-{k8s_versions}-upgrade-test-{capm3_target_branch}'
    description: "CAPM3 e2e k8s upgrade tests on ubuntu."
    project-type: pipeline
    defaults: global
    disabled: False
    concurrent: True
    parameters:
    # Parameters set by Prow
    - string:
        name: BUILD_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: PROW_JOB_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: REPO_OWNER
        default: 'metal3-io'
        description: 'Project github repo org name'
    - string:
        name: REPO_NAME
        default: 'cluster-api-provider-metal3'
        description: 'Project github repo name'
    - string:
        name: PULL_BASE_REF
        default: '{capm3_release_branch}'
        description: 'Ref name of the base branch'
    - string:
        name: PULL_PULL_SHA
        default: '{capm3_release_branch}'
        description: 'Pull request head SHA'
    - string:
        name: PULL_NUMBER
        description: 'Pull request number'
    # End of Prow parameters
    - string:
        name: IMAGE_OS
        default: "ubuntu"
        description: 'Distribution to use for the target host as well as source and target cluster. Can be ubuntu or centos'
    - string:
        name: capm3_release_branch
        default: '{capm3_release_branch}'
        description: 'The target branch of CAPM3 to be used for this test'
    - string:
        name: bmo_release_branch
        default: '{bmo_release_branch}'
        description: 'The target branch of BMO to be used for this test'
    - string:
        name: CAPI_VERSION
        default: '{capi_version}'
        description: 'Cluster API version. E.g. v1beta2.'
    - string:
        name: CAPM3_VERSION
        default: '{capm3_version}'
        description: 'Cluster API provider Metal3 version. E.g. v1beta2.'
    - string:
        name: NUM_NODES
        default: 4
        description: 'Number of libvirt VMs.'
    - string:
        name: GINKGO_FOCUS
        default: "k8s-upgrade"
        description: 'Select the e2e upgrade test'
    - string:
        name: KUBERNETES_VERSION_UPGRADE_FROM
        default: '{k8s_version_upgrade_from}'
        description: 'Kubernetes version upgrade from'
    - string:
        name: KUBERNETES_VERSION_UPGRADE_TO
        default: '{k8s_version_upgrade_to}'
        description: 'Kubernetes version upgrade to'

    properties:
    - build-discarder:
        days-to-keep: 30
        num-to-keep: 300
        artifact-days-to-keep: -1
        artifact-num-to-keep: -1

    triggers: "{triggers}"
    pipeline-scm:
      scm:
      - git:
          url: "{ci_github_repo}"
          branches:
          - '{branch|main}'
          name: 'origin'
          refspec: '+refs/heads/*:refs/remotes/origin/*'
          wipe-workspace: True
          honor-refspec: True
          shallow-clone: False
      script-path: "{e2e_tests_pipeline}"
      lightweight-checkout: False
