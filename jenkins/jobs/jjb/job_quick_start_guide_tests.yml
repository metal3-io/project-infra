# Description:
# ============
# This file contains the job template definition for the metal3-docs Quick Start
# Guide test. It runs the hack/quick-start/quick-start-test.sh script on a
# libvirt-enabled Jenkins worker.
# This job can be triggered through a Github pull request (via Prow) or on a
# timer (periodic). It creates a pipeline job. The pipeline scripts are
# maintained in the Metal3 CI project-infra repository.

- job-template:
    id: quick_start_guide_tests
    name: '{job_prefix}-quick-start-test'
    description: "Test the metal3-docs Quick Start Guide (hack/quick-start/quick-start-test.sh)."
    project-type: pipeline
    defaults: global
    disabled: False
    concurrent: True
    parameters:
    # Parameters set by Prow
    - string:
        name: BUILD_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: PROW_JOB_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: REPO_OWNER
        default: 'metal3-io'
        description: 'Project github repo org name'
    - string:
        name: REPO_NAME
        default: 'metal3-docs'
        description: 'Project github repo name'
    - string:
        name: PULL_BASE_REF
        default: 'main'
        description: 'Ref name of the base branch'
    - string:
        name: PULL_PULL_SHA
        default: 'main'
        description: 'Pull request head SHA'
    - string:
        name: PULL_NUMBER
        description: 'Pull request number'
    # End of Prow parameters

    properties:
    - build-discarder:
        days-to-keep: 30
        num-to-keep: 300
        artifact-days-to-keep: -1
        artifact-num-to-keep: -1

    triggers: "{triggers}"

    pipeline-scm:
      scm:
      - git:
          url: "{ci_github_repo}"
          branches:
          - '{branch|main}'
          name: 'origin'
          refspec: '+refs/heads/*:refs/remotes/origin/*'
          wipe-workspace: True
          honor-refspec: True
          shallow-clone: False
      script-path: 'jenkins/jobs/quick_start_guide_tests.groovy'
      lightweight-checkout: False
