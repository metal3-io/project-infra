- job-group:
    name: k8s-pre-release
    crictl_version: v1.34.0
    crio_version: v1.34.0
    capm3_target_branch: main
    capi_version: v1beta2
    capm3_version: v1beta2
    capm3_release_branch: main
    bmo_release_branch: main
    jobs:
    - capm3_e2e_integration_k8s_pre_release_tests_prow
    - capm3_e2e_integration_k8s_pre_release_tests_prow:
        # TODO: This job is not used. It has no trigger, so it is identical to the
        # PR job above, except it is named "metal3-periodic-*".
        job_prefix: metal3-periodic
        exclude:
        - image_os: ubuntu
    - capm3_e2e_k8s_upgrade_pre_release_tests_prow:
        k8s_version_upgrade_from: v1.34.9
        exclude:
        - image_os: centos
    - capm3_e2e_k8s_upgrade_pre_release_tests_prow:
        # TODO: This job is not used. It has no trigger, so it is identical to the
        # PR job above, except it is named "metal3-periodic-*".
        job_prefix: metal3-periodic
        k8s_version_upgrade_from: v1.34.9
        exclude:
        - image_os: centos

- project:
    name: "capm3-prow"
    triggers: []
    image_os:
    - ubuntu
    - centos
    jobs:
    - capm3-main
    - capm3-release-1-14
    - capm3-release-1-13
    - capm3-release-1-12
    - clusterctl-upgrade
    - k8s-upgrade-1-36-1-37
    - k8s-upgrade-1-35-1-36
    - k8s-upgrade-1-34-1-35
    - k8s-pre-release

- job-group:
    name: dev-env-main
    capm3_target_branch: main
    capi_version: v1beta2
    capm3_version: v1beta2
    capm3_release_branch: main
    bmo_release_branch: main
    target_branches:
    - 'main'
    jobs:
    - dev_env_integration_tests_prow
    - dev_env_integration_tests_prow:
        job_prefix: metal3-periodic
        cni_provider: "cilium"
        triggers:
        - timed: "H 3 * * *"

- project:
    name: dev-env-integration-tests-prow
    proj:
    - metal3_dev_env:
        repo: metal3-dev-env
    - project_infra:
        repo: project-infra
    - capm3:
        repo: cluster-api-provider-metal3
    - bmo:
        repo: baremetal-operator
    - ipam:
        repo: ip-address-manager
    - ironic_image:
        repo: ironic-image
        name_postfix: '_ironic_from_source'
        trigger_postfix: '-ironic-source'
        ironic_install_type: 'source'
    - ironic_ipa_downloader:
        repo: ironic-ipa-downloader
    - mariadb_image:
        repo: mariadb-image
        build_mariadb_image_locally: 'true'
        ironic_use_mariadb: 'true'
    - ironic_standalone_operator:
        repo: ironic-standalone-operator
        use_irso: 'true'
        capm3_target_branch:
        - main
    image_os:
    - ubuntu
    - centos
    triggers: []
    jobs:
    - dev-env-main
    - dev_env_integration_tests_prow:
        capm3_target_branch:
        - release-1-14:
            capi_version: v1beta2
            capm3_version: v1beta2
            capm3_release_branch: release-1.14
            bmo_release_branch: release-0.14
            target_branches:
            - 'main'
            - 'release-1.14'
            - 'release-0.14'
        - release-1-13:
            capi_version: v1beta2
            capm3_version: v1beta2
            capm3_release_branch: release-1.13
            bmo_release_branch: release-0.13
            target_branches:
            - 'main'
            - 'release-1.13'
            - 'release-0.13'
        - release-1-12:
            capi_version: v1beta1
            capm3_version: v1beta1
            capm3_release_branch: release-1.12
            bmo_release_branch: release-0.12
            target_branches:
            - 'main'
            - 'release-1.12'
            - 'release-0.12'

- project:
    name: bmo
    # Default "type" of job is "pull", as in pull request,
    # and the default ginkgo_focus is empty (all tests required in BMO PRs)
    type: pull
    # Default BMO branch to trigger the test in is "main"
    branch_name: "main"
    # These jobs are triggered by prow for PRs (empty trigger here) or by timer (see below)
    triggers: []
    jobs:
    - bmo_e2e_tests:
        type:
        - pull:
            ginkgo_focus: " "
        # This job runs the "optional" set, which currently includes only "upgrade" test
        - optional-pull:
            ginkgo_focus: "upgrade"
