# Description:
# ============
# This file contains the list of JJB projects in metal3 category. Each project
# corresponds to a github repository. Under each project's 'jobs' list defines the
# jobs associated with that github repository. The job definitions can be found
# in job_{job_id}.yml files in any of JJB include folders.

- project:
    name: 'image_building'
    capi_version: v1beta2
    capm3_version: v1beta2
    capm3_release_branch: main
    bmo_release_branch: main
    k8s_version: v1.37.0
    crictl_version: v1.36.0
    crio_version: v1.36.4
    triggers: []
    jobs:
    - ci_image_building
    - ci_image_building:
        job_prefix: metal3-periodic
        triggers:
        - timed: "0 6 */14 * *"
    - node_image_building
    - node_image_building:
        job_prefix: metal3-periodic
        triggers:
        - timed: "0 5 */14 * *"

- project:
    name: 'project_infra'
    capi_version: v1beta2
    capm3_version: v1beta2
    triggers: []
    jobs:
    - periodic_osv_scanner_metal3_repos
    - fullstack_project_infra_building_test_prow
    - fullstack_project_infra_building_test_prow:
        job_prefix: metal3-periodic
        # TODO: Is this really needed?
        # Why do we have different values for periodic and PR jobs?
        staging_default: "true"
        triggers:
        - timed: "0 4  * * 1,3,5,7"
    - periodic_clean

- project:
    name: 'metal3_docs'
    triggers: []
    jobs:
    - quick_start_guide_tests
    - quick_start_guide_tests:
        job_prefix: metal3-periodic
        triggers:
        - timed: "0 0 * * *" # Runs every day at 0.00 UTC (matches the GitHub Action periodic)

- job-group:
    name: capm3-main
    capm3_target_branch: main
    capi_version: v1beta2
    capm3_version: v1beta2
    capm3_release_branch: main
    bmo_release_branch: main
    jobs:
    - capm3_e2e_integration_tests_prow
    - capm3_e2e_integration_tests_prow:
        job_prefix: metal3-periodic
        triggers:
        - timed: "0 4 * * *" # Runs every day at 4.00 UTC (6.00 EET)
    - capm3_e2e_integration_tests_prow:
        # Nightly build jobs (with suffix)
        suffix: "-capi-nightly-build"
        capi_nightly_build: true
    - capm3_e2e_integration_tests_prow:
        job_prefix: metal3-periodic
        # Nightly build jobs (with suffix)
        suffix: "-capi-nightly-build"
        capi_nightly_build: true
        triggers:
        - timed: "0 5 * * *" # Runs every day at 5.00 UTC (7.00 EET)
    - capm3_e2e_feature_tests_prow:
        capm3_target_job: main-pivoting
        ginkgo_focus: pivoting
        num_nodes: 4
    - capm3_e2e_feature_tests_prow:
        job_prefix: metal3-periodic
        capm3_target_job: main-pivoting
        ginkgo_focus: pivoting
        num_nodes: 4
        exclude:
        - image_os: ubuntu
        triggers:
        - timed: "0 15 * * *" # Runs every day at 15.00 UTC (17.00 EET)
    - capm3_e2e_feature_tests_prow:
        capm3_target_job: main-remediation
        ginkgo_focus: remediation
        num_nodes: 4
    - capm3_e2e_feature_tests_prow:
        job_prefix: metal3-periodic
        capm3_target_job: main-remediation
        ginkgo_focus: remediation
        num_nodes: 4
        exclude:
        - image_os: ubuntu
        triggers:
        - timed: "0 17 * * *" # Runs every day at 17.00 UTC (19.00 EET)
    - capm3_e2e_feature_tests_prow:
        capm3_target_job: main-features
        ginkgo_focus: features
        num_nodes: 4
    - capm3_e2e_feature_tests_prow:
        capm3_target_job: main-features
        capm3_version: v1beta1
        suffix: "-v1beta1"
        ginkgo_focus: features
        num_nodes: 4
    - capm3_e2e_feature_tests_prow:
        job_prefix: metal3-periodic
        capm3_target_job: main-features
        ginkgo_focus: features
        num_nodes: 4
        cni_provider: "cilium"
        exclude:
        - image_os: ubuntu
        triggers:
        - timed: "0 19 * * *" # Runs every day at 19.00 UTC (21.00 EET)
    - capm3_e2e_feature_tests_prow:
        job_prefix: metal3-periodic
        capm3_target_job: main-features
        capm3_version: v1beta1
        suffix: "-v1beta1"
        ginkgo_focus: features
        num_nodes: 4
        cni_provider: "cilium"
        exclude:
        - image_os: ubuntu
        triggers:
        - timed: "0 19 * * *" # Runs every day at 19.00 UTC (21.00 EET)
    - capm3_e2e_feature_tests_prow:
        capm3_target_job: main-scalability
        ginkgo_focus: scalability
        num_nodes: 30
    - capm3_e2e_feature_tests_prow:
        job_prefix: metal3-periodic
        capm3_target_job: main-scalability
        ginkgo_focus: scalability
        num_nodes: 30
        exclude:
        - image_os: ubuntu
        triggers:
        - timed: "0 2 * * *" # Runs every day at 2.00 UTC (4.00 EET)
    - capm3_e2e_k8s_conformance_tests_prow:
        exclude:
        - image_os: centos
    - capm3_e2e_k8s_conformance_tests_prow:
        job_prefix: metal3-periodic
        exclude:
        - image_os: centos
        triggers:
        - timed: "0 1 * * *" # Runs every day at 1.00 UTC (3.00 EET)
    - capm3_e2e_capi_md_tests_prow
    - capm3_e2e_capi_md_tests_prow:
        job_prefix: metal3-periodic
        exclude:
        - image_os: ubuntu
        triggers:
        - timed: "0 2 * * *" # Runs every day at 2.00 UTC (4.00 EET)
    - capm3_e2e_k8s_upgrade_n3_tests_prow:
        kubernetes_n0_version: v1.34.9
        kubernetes_n1_version: v1.35.6
        kubernetes_n2_version: v1.36.2
        kubernetes_n3_version: v1.37.0
        exclude:
        - image_os: centos
    - capm3_e2e_k8s_upgrade_n3_tests_prow:
        job_prefix: metal3-periodic
        kubernetes_n0_version: v1.34.9
        kubernetes_n1_version: v1.35.6
        kubernetes_n2_version: v1.36.2
        kubernetes_n3_version: v1.37.0
        exclude:
        - image_os: centos
        triggers:
        - timed: "0 8 * * 6" # Runs every Saturday at 8 AM (10 AM EET)
    - capm3_e2e_k8s_in_place_upgrade_tests_prow:
        k8s_version_upgrade_from: v1.36.2
        k8s_version_upgrade_to: v1.37.0
        exclude:
        - image_os: ubuntu
    - capm3_e2e_k8s_in_place_upgrade_tests_prow:
        job_prefix: metal3-periodic
        k8s_version_upgrade_from: v1.36.2
        k8s_version_upgrade_to: v1.37.0
        exclude:
        - image_os: ubuntu
        triggers:
        - timed: "0 8 * * 6" # Runs every Saturday at 8 AM (10 AM EET)

