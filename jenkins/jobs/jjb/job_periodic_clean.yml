# Description:
# ============
# This file contains job template definition for resource cleanup.
# This job runs periodically every 6 hours and can also be triggered manually.
# It creates a pipeline job.
# The pipeline scripts are maintained in Metal3 CI project infra repository.

- job-template:
    id: periodic_clean
    name: '{job_prefix}_periodic_resource_cleanup'
    description: "Resource cleanup"
    project-type: pipeline
    defaults: global
    disabled: False
    concurrent: True
    parameters:
    # Parameters set by Prow
    - string:
        name: BUILD_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: PROW_JOB_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: REPO_OWNER
        default: 'metal3-io'
        description: 'Project github repo org name'
    - string:
        name: REPO_NAME
        default: 'cluster-api-provider-metal3'
        description: 'Project github repo name'
    - string:
        name: PULL_BASE_REF
        default: 'main'
        description: 'Ref name of the base branch'
    - string:
        name: PULL_PULL_SHA
        default: 'main'
        description: 'Pull request head SHA'
    - string:
        name: PULL_NUMBER
        description: 'Pull request number'
    # End of Prow parameters

    properties:
    - build-discarder:
        days-to-keep: 30
        num-to-keep: 300
        artifact-days-to-keep: -1
        artifact-num-to-keep: -1

    triggers:
    - timed: "0 */6 * * *"

    pipeline-scm:
      scm:
      - git:
          url: "{ci_github_repo}"
          branches:
          - '{branch|main}'
          name: 'origin'
          refspec: '+refs/heads/*:refs/remotes/origin/*'
          wipe-workspace: True
          honor-refspec: True
          shallow-clone: False
      script-path: "jenkins/jobs/clean_resources.groovy"
      lightweight-checkout: False
