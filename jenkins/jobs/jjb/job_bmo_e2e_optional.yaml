# Description:
# ============
# This file contains job template definition for Bare Metal Operator (BMO) e2e
# tests. These jobs are triggered by Prow for BMO pull requests. It creates a
# pipeline job. The pipeline scripts are maintained in Metal3 CI project infra
# repository.

- job-template:
    id: bmo_e2e_tests
    name: "{job_prefix}-{name}-e2e-test-{type}"
    project-type: pipeline
    defaults: global
    disabled: False
    concurrent: True

    parameters:
    # Parameters set by Prow
    - string:
        name: BUILD_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: PROW_JOB_ID
        description: 'Used by Prow when triggering jobs'
    - string:
        name: REPO_OWNER
        description: 'Project github repo org name'
    - string:
        name: REPO_NAME
        description: 'Project github repo name'
    - string:
        name: PULL_BASE_REF
        default: '{branch_name}'
        description: 'Ref name of the base branch'
    - string:
        name: PULL_PULL_SHA
        default: '{branch_name}' # Default set to branch name. This is needed when running periodic jobs
        description: 'Pull request head SHA'
    # End of Prow parameters
    - string:
        name: GINKGO_FOCUS
        default: '{ginkgo_focus}'
        description: 'The focus test to run'

    properties:
    - build-discarder:
        days-to-keep: 30
        num-to-keep: 300
        artifact-days-to-keep: -1
        artifact-num-to-keep: -1
    - github:
        url: https://github.com/metal3-io/baremetal-operator

    triggers: "{triggers}"

    pipeline-scm:
      scm:
      - git:
          url: "{ci_github_repo}"
          branches:
          - "{branch|main}"
          name: 'origin'
          refspec: "+refs/heads/*:refs/remotes/origin/*"
          wipe-workspace: True
          honor-refspec: True
          shallow-clone: False
      script-path: "jenkins/jobs/bmo_e2e_optional_tests.groovy"
      lightweight-checkout: False
