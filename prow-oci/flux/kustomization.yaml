apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OCI variant of ../../prow/flux. Same flux-operator + FluxInstance, but ../capi
# here resolves to prow-oci/capi (CAPOCI) instead of the OpenStack capi, and the
# FluxInstance syncs the prow-oci/flux path.
resources:
- https://github.com/controlplaneio-fluxcd/flux-operator/releases/download/v0.40.0/install.yaml
- flux.yaml
- ../capi

patches:
# Add toleration and node selector to run on infra nodes
- path: toleration-node-selector-patch.yaml
  target:
    kind: Deployment
    name: flux-operator
    namespace: flux-system
