# Credentials for the CAPOCI controller, synced from 1Password by ESO.
# NOTE: currently the local secretGenerator path in kustomization.yaml is
# ACTIVE instead of this. To switch to 1Password: enable this resource in
# kustomization.yaml, disable the secretGenerator, and remove oci-variables.env.
#
# The `onepassword` ClusterSecretStore must allow the
# cluster-api-provider-oci-system namespace (see ../../bootstrap/clustersecretstore.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-variables
  namespace: cluster-api-provider-oci-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: OCI_TENANCY_ID_B64
    remoteRef:
      key: "prow-oci-credentials/tenancy_id_b64"
  - secretKey: OCI_USER_ID_B64
    remoteRef:
      key: "prow-oci-credentials/user_id_b64"
  - secretKey: OCI_CREDENTIALS_FINGERPRINT_B64
    remoteRef:
      key: "prow-oci-credentials/fingerprint_b64"
  - secretKey: OCI_CREDENTIALS_KEY_B64
    remoteRef:
      key: "prow-oci-credentials/api_key_b64"
  - secretKey: OCI_REGION_B64
    remoteRef:
      key: "prow-oci-credentials/region_b64"
  - secretKey: USE_INSTANCE_PRINCIPAL_B64
    remoteRef:
      key: "prow-oci-credentials/use_instance_principal_b64"
