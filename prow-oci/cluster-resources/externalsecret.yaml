# Cloud config for the OCI cloud controller manager (OCCM) and CSI driver,
# synced from 1Password by ESO. Replaces the OpenStack cloud.conf secret
# (../../cluster-resources/externalsecret.yaml).
#
# NOTE: to use this instead of the local secretGenerator, enable
# `externalsecret.yaml` in kustomization.yaml, disable the secretGenerator, and
# remove the local prow-cloud-provider.yaml.
#
# Two secrets are produced from the SAME 1Password field
# (prow-cloud-provider/cloud-provider.yaml), because the CCM and the CSI driver
# read their config from different secret names/keys:
#   - CCM: secret oci-cloud-controller-manager, key cloud-provider.yaml
#   - CSI: secret oci-volume-provisioner,        key config.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-cloud-controller-manager
  namespace: kube-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: cloud-provider.yaml
    remoteRef:
      key: "prow-cloud-provider/cloud-provider.yaml"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-volume-provisioner
  namespace: kube-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: config.yaml
    remoteRef:
      key: "prow-cloud-provider/cloud-provider.yaml"
