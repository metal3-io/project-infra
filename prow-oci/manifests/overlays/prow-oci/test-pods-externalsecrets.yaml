# ExternalSecrets for the test-pods namespace on the OCI instance.
# s3-credentials sourced from the OCI item s3-credentials-oci (see prow ns above).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: test-pods
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: "prow-github-token/password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-credentials
  namespace: test-pods
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: service-account.json
    remoteRef:
      key: "s3-credentials-oci/service-account.json"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-token
  namespace: test-pods
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: "prow-artifactory-token/fulltoken"
