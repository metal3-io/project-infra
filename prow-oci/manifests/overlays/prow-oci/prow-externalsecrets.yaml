# ExternalSecrets for the prow namespace on the OCI instance.
# Same as the metal3 overlay EXCEPT s3-credentials, whose 1Password source item
# is s3-credentials-oci (OCI Object Storage key), not s3-credentials (Swift/Ceph).
# The in-cluster Secret name stays "s3-credentials" (config.yaml references it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: prow
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  # GitHub App private key (PEM). Mounted at /etc/github/appkey and read by the
  # core Prow components via --github-app-private-key-path.
  - secretKey: appkey
    remoteRef:
      key: "prow-github-app/private-key"
  # GitHub App ID (not secret). Injected into each core component as the
  # GITHUB_APP_ID env var and referenced by --github-app-id=$(GITHUB_APP_ID).
  - secretKey: appid
    remoteRef:
      key: "prow-github-app/app-id"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hmac-token
  namespace: prow
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: hmac
    remoteRef:
      key: "hmac-token/password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-credentials
  namespace: prow
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: service-account.json
    remoteRef:
      # OCI Object Storage credentials.
      key: "s3-credentials-oci/service-account.json"
---
