image:
  tag: v3.7.9

providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  listeners:
    web:
      port: 8000
      # Parallel OCI instance uses its own hostname during validation. Switch to
      # prow.apps.test.metal3.io at cutover (Phase 8).
      hostname: "prow-oci.apps.test.metal3.io"
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      hostname: "prow-oci.apps.test.metal3.io"
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
      - name: metal3-io-tls
        namespace: prow

# Pod replicas for HA
deployment:
  replicas: 2

# Tolerations for infra nodes
tolerations:
- key: node-role.kubernetes.io/infra
  operator: Exists
  effect: NoSchedule
# Node selector for infra nodes
nodeSelector:
  node-role.kubernetes.io/infra: ""

# Pod Disruption Budget for HA
podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Cluster
    # TODO: before the Phase 8 switch, set this to the pre-created OCI reserved
    # public IP so the address survives Service/LB recreation:
    # loadBalancerIP: "<oci-reserved-public-ip>"
  annotations:
    # OCI flexible load balancer (replaces the OpenStack floating-IP annotation).
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "100"
