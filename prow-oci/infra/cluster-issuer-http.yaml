apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http-prod
spec:
  acme:
    email: estjorvas@est.tech
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-http-prod
    solvers:
    - http01:
        gatewayHTTPRoute:
          serviceType: ClusterIP
          parentRefs:
          - kind: Gateway
            name: traefik-gateway
            namespace: traefik
      selector: {}
