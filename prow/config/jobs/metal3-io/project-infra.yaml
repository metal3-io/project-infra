presubmits:
  metal3-io/project-infra:
  - name: check-prow-config
    skip_if_only_changed: '(((^|/)OWNERS)|((^|/)OWNERS_ALIASES)|(\.md))$'
    decorate: true
    spec:
      containers:
      - image: us-docker.pkg.dev/k8s-infra-prow/images/checkconfig:v20260930-820f8d138
        command:
        - checkconfig
        args:
        - "--config-path"
        - "prow/config/config.yaml"
        - "--plugin-config"
        - "prow/config/plugins.yaml"
        - "--job-config-path"
        - "prow/config/jobs"
        - "--strict"
        resources:
          requests:
            memory: "500Mi"
  - name: markdownlint
    run_if_changed: '(\.md|markdownlint\.sh)$'
    decorate: true
    spec:
      containers:
      - args:
        - ./hack/markdownlint.sh
        command:
        - sh
        env:
        - name: IS_CONTAINER
          value: "TRUE"
        image: docker.io/pipelinecomponents/markdownlint-cli2:0.14.41@sha256:60785c4a4ec97442f8986f1ce3cbea347f0097a05fc5f48c128714a120078716
        imagePullPolicy: Always
  - name: shellcheck
    run_if_changed: '((\.sh)|^Makefile)$'
    decorate: true
    spec:
      containers:
      - args:
        - ./hack/shellcheck.sh
        command:
        - sh
        env:
        - name: IS_CONTAINER
          value: "TRUE"
        image: docker.io/koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
        imagePullPolicy: Always
  - name: groovylint
    run_if_changed: '(\.groovy|groovylint\.sh|\.groovylintrc\.json|^prow/config/jobs/metal3-io/project-infra\.yaml)$'
    decorate: true
    spec:
      containers:
      - args:
        - ./hack/groovylint.sh
        command:
        - sh
        env:
        - name: IS_CONTAINER
          value: "TRUE"
        image: docker.io/nvuillam/npm-groovy-lint:v19.0.1@sha256:d614f73d8f6d9cb1289f2872cee59b1ca0519b40bcfb0a5f4c8d1ca2dbb08573
        imagePullPolicy: Always
  - name: spellcheck
    run_if_changed: '(\.md|spellcheck\.sh|.cspell-config.json)$'
    decorate: true
    spec:
      containers:
      - args:
        - ./hack/spellcheck.sh
        command:
        - sh
        env:
        - name: IS_CONTAINER
          value: "TRUE"
        image: ghcr.io/streetsidesoftware/cspell:10.4.1@sha256:ca384c4d7d92a76428f6869098f1a6092459c3651082442e171858dc74a5010e
        imagePullPolicy: Always
  - name: renovate-config-validator
    run_if_changed: '(renovate\.json|renovate-validator\.sh)$'
    decorate: true
    spec:
      containers:
      - args:
        - ./hack/renovate-validator.sh
        command:
        - sh
        env:
        - name: IS_CONTAINER
          value: "TRUE"
        image: docker.io/node:24-alpine
        imagePullPolicy: Always
